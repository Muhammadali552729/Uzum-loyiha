 <!DOCTYPE html>
<html lang="uz">
<head>
    {% load static %}
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yuklanmoqda...</title>

    <!-- TAILWIND & FONT AWESOME -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">

    <style>
        body {
            background: #0f172a;
            overflow: hidden;
        }

        /* Elementlarning mayin chiqishi */
        @keyframes fadeUp {
            0% { transform: translateY(20px); opacity: 0; }
            100% { transform: translateY(0); opacity: 1; }
        }

        /* Chiziqli progress bar animatsiyasi */
        @keyframes progress {
            0% { width: 0%; }
            100% { width: 100%; }
        }

        .animate-fade-up {
            animation: fadeUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
        
        .progress-fill {
            animation: progress 2.8s linear forwards;
        }
    </style>
</head>

<body class="flex flex-col items-center justify-between h-screen py-12 antialiased bg-[#340067]">

    <!-- ASOSIY LOGO VA MATN -->
    <div class="flex-1 flex flex-col items-center justify-center text-center">

            <!-- Ichki gradient quti va rasm -->
            <div class="w-38 h-38 rounded-[26px] bg-gradient-to-br from-indigo-500 to-purple-600 p-0.5 shadow-[0_0_50px_rgba(99,102,241,0.2)]">

<div class="flex justify-center items-center gap-[20px]">

        <img class="w-[50px] h-[50px] rounded-[10px]  mt-[30px] " src="https://media.licdn.com/dms/image/v2/D560BAQGySIEE8TX8-Q/company-logo_200_200/company-logo_200_200/0/1699104977748/uzum_tezkor_logo?e=2147483647&v=beta&t=Pfh3utNwMSA3rWEmpz52QpsGD3UBxcmk6hASereij7Q" alt="">

        </div>
 <!-- Kichik xavfsizlik matni -->
        <span class="text-[9px] font-bold text-slate-500 tracking-widest uppercase font-mono">
